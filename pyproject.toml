[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-input-check"
version = "0.1.0"
description = "Read-only RNA-seq input validation with standalone HTML, JSON and TSV reports"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Shahin Behrouz Sharif"}]
keywords = ["RNA-seq", "bioinformatics", "quality-control", "GTF", "Salmon"]

[project.scripts]
rnaseq-input-check = "rnaseq_input_check.core:main"

[tool.setuptools.packages.find]
include = ["rnaseq_input_check*"]
