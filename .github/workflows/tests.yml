name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install samtools and R
        run: sudo apt-get update && sudo apt-get install -y samtools r-base-core
      - name: Run tests including real BAM integration
        run: python -m unittest discover -s tests -v
      - name: Run documented example
        run: python RNAseqInputCheck.py --config examples/tiny/config.json --out results/ci
      - name: Test installed command
        run: |
          python -m pip install .
          cd /tmp
          rnaseq-input-check --version
      - uses: actions/upload-artifact@v4
        with:
          name: example-report-${{ matrix.python }}
          path: results/ci/
